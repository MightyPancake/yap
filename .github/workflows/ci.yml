name: CI

on:
  push: {}
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make git valgrind tcc libclang-18-dev

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          # No --remote: the superproject's recorded commits are the point of pinning.
          # With it, CI checked out each submodule's main and ignored the pointer, so a
          # branch that changes a component and its consumer together could not build.
          git submodule update --init --recursive include/utils components/yap-ts components/yap-c components/yap-semantic
          git -C components/yap-c submodule update --init --recursive tinycc

      - name: Ensure Valgrind headers are available
        run: test -f /usr/include/valgrind/memcheck.h

      - name: Path setup
        run: make path

      - name: Bindgen smoke test
        run: make bindgen_smoke bindgen_header="<stdio.h>"

      - name: Generate bindings
        run: make bindings

      - name: Run tests
        run: make test detailed=true

      - name: Hello world
        run: make hello

      # Built last, since it rebuilds everything at -O2 with logging compiled out.
      # Catches breakage the debug build hides, and checks a release compile emits
      # nothing on stdout or stderr on success.
      - name: Release build
        run: make release

      - name: Release build stays quiet
        run: |
          ./yap tests/pass/arrays.yp -o /tmp/release_check >/tmp/rel.out 2>/tmp/rel.err
          if [ -s /tmp/rel.out ] || [ -s /tmp/rel.err ]; then
            echo "release build wrote to stdout/stderr on a successful compile:"
            cat /tmp/rel.out /tmp/rel.err
            exit 1
          fi